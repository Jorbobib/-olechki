<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Для МОЕГО КОТЕНКА ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
  background:#111 url("Uly.jpg") center center/50% auto no-repeat fixed;
}
body:before{
  content:"";position:fixed;inset:0;
  background:rgba(0,0,0,.48);
}
.wrap{position:relative;z-index:1;text-align:center;padding:30px}
.heart{
  font-size:70px;line-height:1;
  animation:pulse 1.5s ease-in-out infinite;
  margin-bottom:28px;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.35));
}
h1{
  margin:0;font-size:clamp(34px,8vw,72px);
  font-weight:700;letter-spacing:-2px;
  text-shadow:0 3px 18px rgba(0,0,0,.45);
}
p{margin:18px 0 0;font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
</head>
<body>
<main class="wrap">
  <div class="heart">❤️</div>
  <h1>Люблю тебя, Уля,<br>мой котёнок</h1>
  <p>Всегда. ❤️</p>
</main>
</body>
</html>
